name: Version Drift Check
on:
  pull_request:
  workflow_dispatch:

jobs:
  check-versions:
    name: Check Version Consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract versions from sources
        id: extract
        run: |
          # Extract Go version from go.mod
          go_version=$(grep '^go ' go.mod | awk '{print $2}')
          echo "go_version=${go_version}" >> $GITHUB_OUTPUT
          
          # Extract kpt version from go.mod (require line)
          kpt_version=$(grep 'github.com/kptdev/kpt ' go.mod | grep -oP 'v\d+\.\d+\.\d+(-[a-zA-Z0-9.]+)?' | head -1)
          echo "kpt_version=${kpt_version}" >> $GITHUB_OUTPUT
          
          # Extract kind version from porch-e2e-ci-jobs.yaml (after kind-action@v1)
          kind_version=$(awk '/helm\/kind-action@v1/,/version:/ {if (/version:/) print $2}' .github/workflows/porch-e2e-ci-jobs.yaml | head -1)
          echo "kind_version=${kind_version}" >> $GITHUB_OUTPUT
          
          # Extract git and docker versions from ubuntu-latest runner
          git_version=$(git --version | awk '{print $3}')
          echo "git_version=${git_version}" >> $GITHUB_OUTPUT
          
          docker_version=$(docker --version | grep -oP 'version \K[0-9.]+')
          echo "docker_version=${docker_version}" >> $GITHUB_OUTPUT

      - name: Extract versions from config.toml
        id: config
        run: |
          # Extract versions from config.toml (stored without 'v' prefix)
          go_version=$(grep '^version_go = ' docs/config.toml | cut -d'"' -f2)
          echo "go_version=${go_version}" >> $GITHUB_OUTPUT
          
          kpt_version=$(grep '^version_kpt = ' docs/config.toml | cut -d'"' -f2)
          echo "kpt_version=v${kpt_version}" >> $GITHUB_OUTPUT
          
          kind_version=$(grep '^version_kind = ' docs/config.toml | cut -d'"' -f2)
          echo "kind_version=v${kind_version}" >> $GITHUB_OUTPUT
          
          kube_version=$(grep '^version_kube = ' docs/config.toml | cut -d'"' -f2)
          echo "kube_version=${kube_version}" >> $GITHUB_OUTPUT
          
          git_version=$(grep '^version_git = ' docs/config.toml | cut -d'"' -f2)
          echo "git_version=${git_version}" >> $GITHUB_OUTPUT
          
          docker_version=$(grep '^version_docker = ' docs/config.toml | cut -d'"' -f2)
          echo "docker_version=${docker_version}" >> $GITHUB_OUTPUT

      - name: Compare versions
        id: compare
        run: |
          echo "=== Version Consistency Check ===" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          errors=0
          warnings=0
          
          # Go version check (CRITICAL - controls build environment)
          if [ "${{ steps.extract.outputs.go_version }}" != "${{ steps.config.outputs.go_version }}" ]; then
            echo "### FAIL: Go version mismatch" >> $GITHUB_STEP_SUMMARY
            echo "- Source (go.mod): ${{ steps.extract.outputs.go_version }}" >> $GITHUB_STEP_SUMMARY
            echo "- Docs (config.toml): ${{ steps.config.outputs.go_version }}" >> $GITHUB_STEP_SUMMARY
            errors=$((errors + 1))
          else
            echo "✓ Go: ${{ steps.extract.outputs.go_version }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          # kpt version check (CRITICAL - core dependency)
          if [ "${{ steps.extract.outputs.kpt_version }}" != "${{ steps.config.outputs.kpt_version }}" ]; then
            echo "### FAIL: kpt version mismatch" >> $GITHUB_STEP_SUMMARY
            echo "- Source (go.mod): ${{ steps.extract.outputs.kpt_version }}" >> $GITHUB_STEP_SUMMARY
            echo "- Docs (config.toml): ${{ steps.config.outputs.kpt_version }}" >> $GITHUB_STEP_SUMMARY
            errors=$((errors + 1))
          else
            echo "✓ kpt: ${{ steps.extract.outputs.kpt_version }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          # kind version check (WARNING - test environment)
          if [ "${{ steps.extract.outputs.kind_version }}" != "${{ steps.config.outputs.kind_version }}" ]; then
            echo "### WARN: kind version mismatch" >> $GITHUB_STEP_SUMMARY
            echo "- Source (.github/workflows): ${{ steps.extract.outputs.kind_version }}" >> $GITHUB_STEP_SUMMARY
            echo "- Docs (config.toml): ${{ steps.config.outputs.kind_version }}" >> $GITHUB_STEP_SUMMARY
            echo "Consider updating docs/config.toml to match the test environment." >> $GITHUB_STEP_SUMMARY
            warnings=$((warnings + 1))
          else
            echo "✓ kind: ${{ steps.extract.outputs.kind_version }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Kubernetes version (INFORMATIONAL - derived from kind)
          echo "ℹ Kubernetes (derived from kind): ${{ steps.extract.outputs.kind_version }} uses k8s ${{ steps.config.outputs.kube_version }}" >> $GITHUB_STEP_SUMMARY
          
          # Git version (INFORMATIONAL - runner-provided)
          if [ "${{ steps.extract.outputs.git_version }}" != "${{ steps.config.outputs.git_version }}" ]; then
            echo "ℹ Git: runner has ${{ steps.extract.outputs.git_version }}, docs list ${{ steps.config.outputs.git_version }} (advisory - updated by GitHub)" >> $GITHUB_STEP_SUMMARY
          else
            echo "✓ Git: ${{ steps.extract.outputs.git_version }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Docker version (INFORMATIONAL - runner-provided)
          if [ "${{ steps.extract.outputs.docker_version }}" != "${{ steps.config.outputs.docker_version }}" ]; then
            echo "ℹ Docker: runner has ${{ steps.extract.outputs.docker_version }}, docs list ${{ steps.config.outputs.docker_version }} (advisory - updated by GitHub)" >> $GITHUB_STEP_SUMMARY
          else
            echo "✓ Docker: ${{ steps.extract.outputs.docker_version }}" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "errors=${errors}" >> $GITHUB_OUTPUT
          echo "warnings=${warnings}" >> $GITHUB_OUTPUT
          
          if [ "$warnings" -gt 0 ]; then
            echo "**Note:** Review warnings above and update docs/config.toml if needed." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if critical mismatches
        if: steps.compare.outputs.errors > 0
        run: |
          echo "Critical version mismatches detected. Please update docs/config.toml to match the source files."
          exit 1
